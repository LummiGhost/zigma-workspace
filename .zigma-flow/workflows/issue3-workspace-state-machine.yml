name: issue3-workspace-state-machine
version: 1.0.0
description: >
  Implement GitHub Issue #3: feat: add Workspace State Machine.
  Adds WorkspaceStatus type, validates transitions, records events,
  exposes status through CLI/API.

on:
  manual:

inputs:
  task:
    type: string
    required: true

skills:
  code:
    uses: skill://zigma.code-change@1

jobs:
  intake:
    steps:
      - id: analyze
        type: agent
        prompt: intake
        with:
          task: "${{ inputs.task }}"
        outputs:
          task_summary: {}
          scope: {}
          complexity_profile: {}
        expose:
          skills:
            - code

  implement:
    needs:
      - intake
    retry:
      max_attempts: 3
      on_exceeded:
        status: failed
    steps:
      - id: implement
        type: agent
        prompt: implement
        with:
          task: "${{ inputs.task }}"
        outputs:
          summary: {}
          files_changed: {}
        expose:
          skills:
            - code
      - id: collect-diff
        type: script
        run: "git diff HEAD"
        failure_policy: fail

  validate:
    needs:
      - implement
    steps:
      - id: check
        type: script
        run: "npm run check"
        timeout: "2m"
        failure_policy: fail

  create-pr:
    needs:
      - validate
    steps:
      - id: commit-and-push
        type: script
        run: "git add -A && git commit -m \"feat: add Workspace State Machine (closes #3)\" && git push -u origin feat/issue-3-workspace-state-machine && gh pr create --title \"feat: add Workspace State Machine\" --body \"Closes #3\" --head feat/issue-3-workspace-state-machine"
        failure_policy: fail
