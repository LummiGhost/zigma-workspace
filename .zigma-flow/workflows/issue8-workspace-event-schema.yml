name: issue8-workspace-event-schema
version: 1.0.0
description: >
  Implement GitHub Issue #8: feat: standardize Workspace Event Schema.
  Defines a stable event model with type, timestamp, actor, workspaceId,
  and payload for integration with zigma-core, zigma-flow, audit, and UI.

on:
  manual:

inputs:
  task:
    type: string
    required: true

skills:
  code:
    uses: skill://zigma.code-change@1

jobs:
  intake:
    steps:
      - id: analyze
        type: agent
        prompt: intake
        with:
          task: "${{ inputs.task }}"
        outputs:
          task_summary: {}
          scope: {}
          complexity_profile: {}
        expose:
          skills:
            - code

  implement:
    needs:
      - intake
    retry:
      max_attempts: 3
      on_exceeded:
        status: failed
    steps:
      - id: implement
        type: agent
        prompt: implement
        with:
          task: "${{ inputs.task }}"
        outputs:
          summary: {}
          files_changed: {}
        expose:
          skills:
            - code
      - id: collect-diff
        type: script
        run: "git diff HEAD"
        failure_policy: fail

  validate:
    needs:
      - implement
    steps:
      - id: check
        type: script
        run: "npm run check"
        timeout: "2m"
        failure_policy: fail

  create-pr:
    needs:
      - validate
    steps:
      - id: commit-push-pr
        type: script
        run: "git checkout -b feat/issue-8-workspace-event-schema && git add -A && git commit -m \"feat: standardize Workspace Event Schema (closes #8)\" && git push -u origin feat/issue-8-workspace-event-schema && gh pr create --title \"feat: standardize Workspace Event Schema\" --body \"Closes #8\" --head feat/issue-8-workspace-event-schema"
        failure_policy: fail
