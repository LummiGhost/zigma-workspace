name: issue5-lease-lock-management
version: 1.0.0
description: >
  Implement GitHub Issue #5: feat: implement Lease-based Lock Management.
  Replace simple locks with lease-based locking that supports heartbeat renewal,
  automatic reclamation of expired leases, and lock history through events.

on:
  manual:

inputs:
  task:
    type: string
    required: true

skills:
  code:
    uses: skill://zigma.code-change@1

jobs:
  intake:
    steps:
      - id: analyze
        type: agent
        prompt: intake
        with:
          task: "${{ inputs.task }}"
        outputs:
          task_summary: {}
          scope: {}
          complexity_profile: {}
        expose:
          skills:
            - code

  implement:
    needs:
      - intake
    retry:
      max_attempts: 3
      on_exceeded:
        status: failed
    steps:
      - id: implement
        type: agent
        prompt: implement
        with:
          task: "${{ inputs.task }}"
        outputs:
          summary: {}
          files_changed: {}
        expose:
          skills:
            - code
      - id: collect-diff
        type: script
        run: "git diff HEAD"
        failure_policy: fail

  validate:
    needs:
      - implement
    steps:
      - id: check
        type: script
        run: "npm run check"
        timeout: "2m"
        failure_policy: fail

  create-pr:
    needs:
      - validate
    steps:
      - id: commit-push-pr
        type: script
        run: "git checkout -b feat/issue-5-lease-lock-management && git add -A && git commit -m \"feat: implement Lease-based Lock Management (closes #5)\" && git push -u origin feat/issue-5-lease-lock-management && gh pr create --title \"feat: implement Lease-based Lock Management\" --body \"Closes #5\" --head feat/issue-5-lease-lock-management"
        failure_policy: fail
