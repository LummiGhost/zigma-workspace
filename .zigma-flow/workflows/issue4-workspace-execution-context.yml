name: issue4-workspace-execution-context
version: 1.0.0
description: >
  Implement GitHub Issue #4: feat: bind Workspace to Workflow Execution Context.
  Extend workspace metadata and the .zigma-workspace.json manifest with
  workflowRunId, jobId, stepId, and agentId for full execution traceability.

on:
  manual:

inputs:
  task:
    type: string
    required: true

skills:
  code:
    uses: skill://zigma.code-change@1

jobs:
  intake:
    steps:
      - id: analyze
        type: agent
        prompt: intake
        with:
          task: "${{ inputs.task }}"
        outputs:
          task_summary: {}
          scope: {}
          complexity_profile: {}
        expose:
          skills:
            - code

  implement:
    needs:
      - intake
    retry:
      max_attempts: 3
      on_exceeded:
        status: failed
    steps:
      - id: implement
        type: agent
        prompt: implement
        with:
          task: "${{ inputs.task }}"
        outputs:
          summary: {}
          files_changed: {}
        expose:
          skills:
            - code
      - id: collect-diff
        type: script
        run: "git diff HEAD"
        failure_policy: fail

  validate:
    needs:
      - implement
    steps:
      - id: check
        type: script
        run: "npm run check"
        timeout: "2m"
        failure_policy: fail

  create-pr:
    needs:
      - validate
    steps:
      - id: commit-push-pr
        type: script
        run: "git checkout -b feat/issue-4-workspace-execution-context && git add -A && git commit -m \"feat: bind Workspace to Workflow Execution Context (closes #4)\" && git push -u origin feat/issue-4-workspace-execution-context && gh pr create --title \"feat: bind Workspace to Workflow Execution Context\" --body \"Closes #4\" --head feat/issue-4-workspace-execution-context"
        failure_policy: fail
